[package]
name = "yank"
version = "0.1.0"
edition = "2024"
description = "A peer-to-peer clipboard daemon"
license = "WTFPL"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
blake3 = "1.8"
bytesize = { version = "2.7", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
color-eyre = "0.6"
data-encoding = "2.11"
etcetera = "0.11"
humantime = "2.4"
iroh = "1.1"
percent-encoding = "2.3"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rand = "0.10"
reflink-copy = "0.1"
rustix = { version = "1.1", features = ["event", "pipe", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = { version = "2.6", default-features = false }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
zeroize = "1.9"

# The Wayland backend, and nothing else, needs these. Kept apart so a
# build for another platform fails on the backend it is missing rather
# than on a Wayland binding it could never have used.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[features]
# Hermetic endpoints and helpers used by the integration tests.
test-util = []

[dev-dependencies]
tempfile = "3"
yank = { path = ".", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true
